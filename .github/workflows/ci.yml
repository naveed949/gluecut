name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install package (dev, no Vega weights stack)
        # vegaml/torch are optional for unit tests + complexity; keep CI light.
        run: uv sync --group dev --no-install-package vegaml

      - name: Pytest
        run: uv run pytest -q

      - name: Complexity (fair LOC breakdown)
        run: uv run python -m triage complexity
